<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yosser_Tweaks - Dashboard</title>
<style>
  :root {
    --bg-main: #050505;
    --bg-secondary: #0D0D0D;
    --card: #131313;
    --card-hover: #1A1A1A;

    --primary: #00FF66;
    --primary-hover: #00E65C;
    --primary-dark: #00C853;

    --border: #1F1F1F;

    --text: #FFFFFF;
    --text-secondary: #A0A0A0;

    --success: #00FF66;
    --warning: #FFD600;
    --danger: #FF3D57;

    --shadow: 0 0 18px rgba(0, 255, 102, .35);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  body {
    background-color: var(--bg-main);
    color: var(--text);
    padding: 24px;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
    padding: 28px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }

  header h1 {
    font-size: 2.8rem;
    margin-bottom: 20px;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 900;
    text-shadow: var(--shadow);
  }

  .monitor-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    max-width: 650px;
    margin: 0 auto 20px auto;
  }

  .monitor-card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 14px;
    border-radius: 12px;
    text-align: center;
  }

  .monitor-card label {
    display: block;
    font-size: 0.75rem;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .monitor-card span {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--primary);
  }

  .hw-info-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    max-width: 850px;
    margin: 0 auto;
    font-size: 0.85rem;
    color: var(--text-secondary);
  }

  .hw-card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 12px;
    border-radius: 10px;
  }

  .hw-card strong {
    color: var(--primary);
  }

  .global-actions {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-bottom: 28px;
  }

  .btn-global {
    background: var(--primary);
    color: #000000;
    border: none;
    padding: 14px 28px;
    border-radius: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: var(--shadow);
    text-transform: uppercase;
  }

  .btn-global:hover {
    background: var(--primary-hover);
    transform: translateY(-2px);
  }

  .btn-restore {
    background: var(--danger);
    color: #ffffff;
    box-shadow: 0 0 18px rgba(255, 61, 87, .35);
  }

  .btn-restore:hover {
    background: #e0324c;
  }

  .tabs-nav {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
    overflow-x: auto;
    padding-bottom: 10px;
  }

  .tab-btn {
    background: var(--bg-secondary);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    padding: 12px 20px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 700;
    white-space: nowrap;
    transition: all 0.2s ease;
  }

  .tab-btn:hover {
    border-color: var(--primary);
    color: var(--text);
  }

  .tab-btn.active {
    background: var(--primary);
    color: #000000;
    border-color: var(--primary);
    box-shadow: var(--shadow);
  }

  .tab-panel {
    display: none;
  }

  .tab-panel.active {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: all 0.2s ease;
  }

  .card:hover {
    background: var(--card-hover);
    border-color: var(--primary);
    transform: translateY(-3px);
    box-shadow: var(--shadow);
  }

  .card h3 {
    font-size: 1.1rem;
    margin-bottom: 8px;
    color: var(--text);
  }

  .card p {
    color: var(--text-secondary);
    font-size: 0.85rem;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .badge-reboot {
    display: inline-block;
    font-size: 0.7rem;
    padding: 4px 8px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-weight: 800;
    width: fit-content;
    text-transform: uppercase;
  }

  .reboot-yes {
    background: rgba(255, 61, 87, 0.15);
    color: var(--danger);
    border: 1px solid var(--danger);
  }

  .reboot-no {
    background: rgba(0, 255, 102, 0.15);
    color: var(--success);
    border: 1px solid var(--success);
  }

  .btn-execute {
    background: var(--bg-secondary);
    color: var(--primary);
    border: 1px solid var(--primary);
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
    width: 100%;
    transition: all 0.2s ease;
  }

  .btn-execute:hover {
    background: var(--primary);
    color: #000000;
    box-shadow: var(--shadow);
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Yosser_Tweaks</h1>
    <div class="monitor-grid">
      <div class="monitor-card">
        <label>CPU Usage</label>
        <span id="cpu-stat">0%</span>
      </div>
      <div class="monitor-card">
        <label>GPU Usage</label>
        <span id="gpu-stat">0%</span>
      </div>
      <div class="monitor-card">
        <label>Disk Active</label>
        <span id="disk-stat">0%</span>
      </div>
    </div>
    <div class="hw-info-grid">
      <div class="hw-card">Almacenamiento: <strong id="detected-storage">Detectando...</strong></div>
      <div class="hw-card">GPU: <strong id="detected-gpu">Detectando...</strong></div>
      <div class="hw-card">RAM Detectada: <strong id="detected-ram">Detectando...</strong></div>
    </div>
  </header>

  <div class="global-actions">
    <button class="btn-global" onclick="runFullOptimization()">⚡ Optimización Completa (1-Clic)</button>
    <button class="btn-global btn-restore" onclick="restoreAllTweaks()">🔄 Restaurar Todos los Tweaks</button>
  </div>

  <nav class="tabs-nav">
    <button class="tab-btn active" onclick="switchTab(event, 'windowTweaks')">Window Tweaks (<span id="count-windowTweaks">0</span>)</button>
    <button class="tab-btn" onclick="switchTab(event, 'internet')">Internet Tweaks (<span id="count-internet">0</span>)</button>
    <button class="tab-btn" onclick="switchTab(event, 'power')">Power Options (<span id="count-power">0</span>)</button>
    <button class="tab-btn" onclick="switchTab(event, 'mouse')">Mouse Zero Delay (<span id="count-mouse">0</span>)</button>
    <button class="tab-btn" onclick="switchTab(event, 'keyboard')">Keyboard Zero Delay (<span id="count-keyboard">0</span>)</button>
  </nav>

  <main>
    <div id="windowTweaks" class="tab-panel active"></div>
    <div id="internet" class="tab-panel"></div>
    <div id="power" class="tab-panel"></div>
    <div id="mouse" class="tab-panel"></div>
    <div id="keyboard" class="tab-panel"></div>
  </main>
</div>

<script>
  function updateHardwareStats() {
    document.getElementById('cpu-stat').textContent = Math.floor(Math.random() * (18 - 3) + 3) + '%';
    document.getElementById('gpu-stat').textContent = Math.floor(Math.random() * (30 - 5) + 5) + '%';
    document.getElementById('disk-stat').textContent = Math.floor(Math.random() * (4 - 1) + 1) + '%';
  }
  setInterval(updateHardwareStats, 2000);
  updateHardwareStats();

  function detectHardware() {
    const ram = navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "No detectada";
    document.getElementById('detected-ram').textContent = ram;

    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    let gpuName = "Desconocida";
    if (gl) {
      const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
      if (debugInfo) {
        gpuName = gl.getParameter(debugInfo.UNMASKED_RENDERER_GL4) || gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
      }
    }
    document.getElementById('detected-gpu').textContent = gpuName.includes('NVIDIA') ? 'NVIDIA' : gpuName.includes('AMD') || gpuName.includes('Radeon') ? 'AMD' : gpuName.includes('Intel') ? 'Intel' : 'Genérica';
    document.getElementById('detected-storage').textContent = "SSD / HDD (Estándar)";
  }
  detectHardware();

  function switchTab(event, panelId) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    
    const selectedPanel = document.getElementById(panelId);
    if (selectedPanel) {
      selectedPanel.classList.add('active');
    }
    event.currentTarget.classList.add('active');
  }

  function downloadScript(filename, content, ext = "reg") {
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${filename}.${ext}`;
    link.click();
    URL.revokeObjectURL(link.href);
  }

  function createRestorePointAndApply(filename, content, ext = "reg") {
    if(ext === "reg") {
      downloadScript(`Tweak_${filename}`, content, "reg");
      alert("Se descargó el Tweak de Registro. Ejecuta como Administrador para aplicar.");
    } else {
      downloadScript(filename, content, ext);
    }
  }

  function runFullOptimization() {

  }

      };
    }),
    power: rawPowerTweaks.map((name, index) => {
      const isBat = name.includes("Plan") || name.includes("PowerCFG") || name.includes("PowerShell") || name.includes("Restore") || name.includes("Timeout");
      return {
        title: name,
        desc: `Configuración de perfil de energía y consumo: ${name}.`,
        reboot: index % 5 === 0,
        label: isBat ? "Ejecutar BAT" : "Descargar .REG",
        action: function() {
          if (isBat) {
            downloadScript(name.replace(/\s+/g, '_'), `@echo off\necho Configurando plan de energía: ${name}\npowercfg -duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61\npause`, "bat");
          } else {
            createRestorePointAndApply(name.replace(/\s+/g, '_'), `Windows Registry Editor Version 5.00\n\n; Power Optimization: ${name}\n[HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Power]\n"${name.replace(/\s+/g, '')}"=dword:00000001`, "reg");
          }
        }
      };
    }),
    mouse: rawMouseTweaks.map((name, index) => {
      const isBat = name.includes("Restore") || name.includes("Driver") || name.includes("Device") || name.includes("Priority");
      return {
        title: name,
        desc: `Optimización de latencia y respuesta de ratón: ${name}.`,
        reboot: index % 6 === 0,
        label: isBat ? "Ejecutar BAT" : "Descargar .REG",
        action: function() {
          if (isBat) {
            downloadScript(name.replace(/\s+/g, '_'), `@echo off\necho Aplicando tweak de ratón: ${name}\npause`, "bat");
          } else {
            createRestorePointAndApply(name.replace(/\s+/g, '_'), `Windows Registry Editor Version 5.00\n\n; Mouse Optimization: ${name}\n[HKEY_CURRENT_USER\\Control Panel\\Mouse]\n"${name.replace(/\s+/g, '')}"="0"`, "reg");
          }
        }
      };
    }),
    keyboard: rawKeyboardTweaks.map((name, index) => {
      const isBat = name.includes("Restore") || name.includes("Driver") || name.includes("Device") || name.includes("Priority");
      return {
        title: name,
        desc: `Optimización de respuesta e input lag del teclado: ${name}.`,
        reboot: index % 5 === 0,
        label: isBat ? "Ejecutar BAT" : "Descargar .REG",
        action: function() {
          if (isBat) {
            downloadScript(name.replace(/\s+/g, '_'), `@echo off\necho Aplicando tweak de teclado: ${name}\npause`, "bat");
          } else {
            createRestorePointAndApply(name.replace(/\s+/g, '_'), `Windows Registry Editor Version 5.00\n\n; Keyboard Optimization: ${name}\n[HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Services\\kbdclass\\Parameters]\n"${name.replace(/\s+/g, '')}"=dword:00000000`, "reg");
          }
        }
      };
    })
  };

  function renderCards() {
    Object.keys(dataModules).forEach(key => {
      const container = document.getElementById(key);
      const countLabel = document.getElementById(`count-${key}`);
      if (!container) return;

      const items = dataModules[key];
      if (countLabel) countLabel.textContent = items.length;

      container.innerHTML = items.map((item, index) => `
        <div class="card">
          <div>
            <h3>${item.title}</h3>
            <p>${item.desc}</p>
            <span class="badge-reboot ${item.reboot ? 'reboot-yes' : 'reboot-no'}">
              ${item.reboot ? '⚠️ Requiere Reinicio' : '⚡ Sin Reinicio'}
            </span>
          </div>
          <button class="btn-execute" onclick="dataModules['${key}'][${index}].action()">${item.label}</button>
        </div>
      `).join('');
    });
  }

  renderCards();
</script>
</body>
</html>
